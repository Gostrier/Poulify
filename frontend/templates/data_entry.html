{% extends "base.html" %}

{% block page_title %}Daily Log Entry{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="p-8 border-b border-gray-50 bg-orange-50/30">
            <h2 class="text-2xl font-bold text-gray-900">Daily Flock Update</h2>
            <p class="text-gray-500 mt-1">Record today's metrics to trigger AI health analysis.</p>
        </div>

        <form action="/save-log" method="POST" class="p-8 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Select Flock</label>
                    <select name="flock_id" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition">
                        {% for flock in user.flocks %}
                        <option value="{{ flock.id }}" {% if selected_flock_id == flock.id %}selected{% endif %}>{{ flock.name }} ({{ flock.breed }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Log Date</label>
                    <input type="date" name="log_date" id="log_date" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Feed (kg)</label>
                    <input type="number" step="0.01" min="0" name="feed" placeholder="0.0" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Water (L)</label>
                    <input type="number" step="0.01" min="0" name="water" placeholder="0.0" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Avg Weight (g)</label>
                    <input type="number" step="0.1" min="0" name="weight" placeholder="0.0" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Eggs Collected</label>
                    <input type="number" min="0" name="eggs" value="0" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Mortality (Count)</label>
                    <input type="number" min="0" name="mortality" value="0" required
                        class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none transition">
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" 
                    class="w-full bg-orange-600 text-white font-bold py-4 rounded-xl hover:bg-orange-700 transition shadow-lg shadow-orange-200 flex items-center justify-center gap-2">
                    <i class="fas fa-microchip"></i>
                    Save Data & Run AI Check
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    // Set default date to today
    document.getElementById('log_date').valueAsDate = new Date();
</script>
{% endblock %}
